services:
  postgres:
    image: postgres:16
    container_name: mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mvp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mvp_api
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp_user -d mvp_api"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
